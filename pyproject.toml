[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-platform"
version = "0.1.0"
description = "Team ETL platform managed by Airflow"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "tenacity>=8.3",
  "neo4j>=6.2.0",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.1",
  "aiohttp>=3.14.2",
  "boto3>=1.34",
  "langgraph>=1.2.6",
  "flashtext>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "pre-commit>=3.7",
]
airflow = [
  "apache-airflow>=3.3",
]

news = [
  "beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# AIR: Airflow 관련 정적 검증(API deprecation, DAG 인자/네이밍 관례 등). DagBag 런타임
# 검증(scripts/validate_dags.py)과 겹치지 않고 보완한다.
select = ["E", "F", "I", "UP", "B", "AIR"]

[tool.ruff.lint.isort]
# prompts/ontology는 gitignore로 비공개라 CI 체크아웃에 파일이 없다. 파일 존재 여부로
# first-party를 추론하면 CI에서 서드파티로 오분류되므로 명시적으로 고정한다.
known-first-party = ["pipelines", "tests", "dags"]

[tool.ruff.lint.per-file-ignores]
# 테스트에 하드코딩된 기사 원문 등 긴 문자열 데이터는 줄길이 제한에서 제외한다.
"tests/**" = ["E501"]
# 프롬프트/온톨로지의 서술형 프롬프트·사전 데이터도 긴 문자열이라 줄길이 제한에서 제외한다.
"pipelines/triplets/graph/prompts/**" = ["E501"]
"pipelines/triplets/graph/ontology/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration: 외부 인프라(로컬 DB 컨테이너 등)가 필요한 테스트. CI unit-test job은
# `-m "not integration"`으로 제외한다. 로컬에서는 DB 기동 후 `pytest -m integration`으로 실행.
markers = [
  "integration: 실행에 로컬 DB 등 외부 인프라가 필요한 테스트",
]

[tool.setuptools.packages.find]
# 배포/설치 대상은 import 되는 pipelines 패키지뿐. dags/migrations/docker는 flat-layout
# 자동탐지에서 제외해야 "multiple top-level packages" 에러 없이 editable 설치가 된다.
where = ["."]
include = ["pipelines*"]

[project]
name = "etl-platform"
version = "0.1.0"
description = "Team ETL platform managed by Airflow"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
airflow = [
  "apache-airflow>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]


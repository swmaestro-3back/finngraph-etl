name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: "빌드할 커밋 SHA (비우면 develop 최신)"
        required: false

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: finngraph/etl-airflow

jobs:
  build-push:
    name: Build and push to ECR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 저장소 변수 확인
        run: |
          : "${AWS_ACCOUNT_ID:?저장소 변수 AWS_ACCOUNT_ID 가 없습니다}"
          : "${DEPLOY_INSTANCE_ID:?저장소 변수 DEPLOY_INSTANCE_ID 가 없습니다}"
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 빌드 대상 확인
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SHA" origin/develop || {
            echo "::error::develop 에 없는 커밋은 빌드하지 않습니다: $SHA"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "빌드 커밋: $SHA"
          git log --oneline -1

      - name: AWS 자격증명 (OIDC — 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/finngraph-github-cd-etl
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 서버 배포 (SSM)
        run: |
          SHA='${{ steps.meta.outputs.sha }}'
          REMOTE=$(cat <<EOS
          set -euo pipefail
          cd /opt/finngraph-etl
          git -c safe.directory=/opt/finngraph-etl fetch origin develop --quiet
          git -c safe.directory=/opt/finngraph-etl reset --hard "$SHA" --quiet
          chown -R ec2-user:ec2-user /opt/finngraph-etl
          scripts/dev-env.sh deploy/dev/.env
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          export ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG="$SHA"
          docker compose -f deploy/dev/compose.yaml \
            up -d --remove-orphans --quiet-pull > /tmp/deploy.log 2>&1 || { tail -40 /tmp/deploy.log; exit 1; }
          docker compose -f deploy/dev/compose.yaml ps
          EOS
          )
          B64=$(printf '%s' "$REMOTE" | base64 -w0)

          CMD=$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD deploy $SHA" --timeout-seconds 900 \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 90); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                   --instance-id "$DEPLOY_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|TimedOut|Cancelled) break ;; *) sleep 10 ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$ST" = "Success" ] || exit 1

      - name: 요약
        run: |
          {
            echo "### ECR push 완료"
            echo '```'
            echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}"
            echo '```'
            echo "### 배포 완료"
            echo "서버가 이 이미지로 교체되었다."
          } >> "$GITHUB_STEP_SUMMARY"

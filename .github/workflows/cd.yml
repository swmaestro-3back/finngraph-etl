name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      sha:
        description: "빌드할 커밋 SHA (비우면 실행한 브랜치의 최신)"
        required: false
  release:
    types: [published]

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  AIRFLOW_REPOSITORY: finngraph/etl-airflow
  MIGRATIONS_REPOSITORY: finngraph/etl-migrations

jobs:
  build-push:
    name: Build and push to ECR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - name: 저장소 변수 확인
        run: |
          : "${AWS_ACCOUNT_ID:?저장소 변수 AWS_ACCOUNT_ID 가 없습니다}"
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 빌드 대상 확인
        id: meta
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case "$BRANCH" in
            develop|main) ;;
            *) echo "::error::develop·main 에서만 빌드합니다: $BRANCH"; exit 1 ;;
          esac
          SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SHA" "origin/$BRANCH" || {
            echo "::error::$BRANCH 에 없는 커밋은 빌드하지 않습니다: $SHA"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "빌드 커밋: $BRANCH $SHA"
          git log --oneline -1

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/finngraph-github-cd-etl
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: airflow 이미지 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.AIRFLOW_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.AIRFLOW_REPOSITORY }}:${{ steps.meta.outputs.branch }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow

      - name: 마이그레이션 이미지 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrations/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.MIGRATIONS_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.MIGRATIONS_REPOSITORY }}:${{ steps.meta.outputs.branch }}

      - name: 요약
        run: |
          {
            echo "### ECR push 완료"
            echo '```'
            echo "${ECR_REGISTRY}/${AIRFLOW_REPOSITORY}:${SHA}"
            echo "${ECR_REGISTRY}/${MIGRATIONS_REPOSITORY}:${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ steps.meta.outputs.sha }}

  deploy-dev:
    name: Deploy to dev
    needs: build-push
    if: needs.build-push.outputs.branch == 'develop'
    runs-on: ubuntu-24.04-arm

    permissions:
      id-token: write
      contents: read

    env:
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}

    steps:
      - name: 저장소 변수 확인
        run: |
          : "${DEPLOY_INSTANCE_ID:?저장소 변수 DEPLOY_INSTANCE_ID 가 없습니다}"

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/finngraph-github-cd-etl
          aws-region: ${{ env.AWS_REGION }}

      - name: 서버 배포 (SSM)
        env:
          SHA: ${{ needs.build-push.outputs.sha }}
        run: |
          REMOTE=$(cat <<EOS
          set -euo pipefail
          cd /opt/finngraph-etl
          git -c safe.directory=/opt/finngraph-etl fetch origin develop --quiet
          git -c safe.directory=/opt/finngraph-etl reset --hard "$SHA" --quiet
          chown -R ec2-user:ec2-user /opt/finngraph-etl
          scripts/dev-env.sh deploy/dev/.env
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          export ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG="$SHA"
          docker compose -f deploy/dev/compose.yaml \
            up -d --remove-orphans --quiet-pull > /tmp/deploy.log 2>&1 || { tail -40 /tmp/deploy.log; exit 1; }
          docker compose -f deploy/dev/compose.yaml ps
          EOS
          )
          B64=$(printf '%s' "$REMOTE" | base64 -w0)

          CMD=$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD deploy $SHA" --timeout-seconds 900 \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 90); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                   --instance-id "$DEPLOY_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|TimedOut|Cancelled) break ;; *) sleep 10 ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$ST" = "Success" ] || exit 1

  release:
    name: Deploy to prod
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04-arm
    environment: prod
    concurrency:
      group: release-prod
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: environment secret 확인
        env:
          DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        run: |
          : "${DEPLOY_INSTANCE_ID:?prod environment secret DEPLOY_INSTANCE_ID 가 없습니다}"

      - name: main 포함 여부 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::릴리스 커밋이 main 에 없다 ($status)"; exit 1 ;;
          esac

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/finngraph-github-cd-etl
          aws-region: ${{ env.AWS_REGION }}

      - name: main 빌드 완료 대기
        run: |
          for _ in $(seq 1 90); do
            missing=""
            for repo in "$AIRFLOW_REPOSITORY" "$MIGRATIONS_REPOSITORY"; do
              aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1 || missing+=" $repo"
            done
            [ -z "$missing" ] && exit 0
            echo "main CD 빌드 대기:$missing:$GITHUB_SHA"
            sleep 10
          done
          echo "::error::15분 안에 main CD 가 이미지를 만들지 않았습니다:$missing:$GITHUB_SHA"
          exit 1

      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: airflow 릴리스 태그
        id: airflow
        uses: swmaestro-3back/github-actions/actions/ecr-tag@main
        with:
          image_name: ${{ env.AIRFLOW_REPOSITORY }}
          source_tag: ${{ github.sha }}
          tags: ${{ github.event.release.tag_name }}

      - name: 마이그레이션 릴리스 태그
        id: migrations
        uses: swmaestro-3back/github-actions/actions/ecr-tag@main
        with:
          image_name: ${{ env.MIGRATIONS_REPOSITORY }}
          source_tag: ${{ github.sha }}
          tags: ${{ github.event.release.tag_name }}

      - name: 배포
        uses: swmaestro-3back/github-actions/actions/ssm-deploy@main
        with:
          instance_id: ${{ secrets.DEPLOY_INSTANCE_ID }}
          compose_dir: /home/ubuntu/finngraph-etl
          compose_file: compose.yaml
          compose_source: deploy/prod/compose.yaml
          env_ssm_prefix: /finngraph/prod/etl
          env_file: etl.env
          env_required_keys: DATABASE_URL AIRFLOW__DATABASE__SQL_ALCHEMY_CONN AIRFLOW__CORE__FERNET_KEY AIRFLOW__API_AUTH__JWT_SECRET _AIRFLOW_WWW_USER_USERNAME _AIRFLOW_WWW_USER_PASSWORD NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD NEO4J_DATABASE INTERNAL_API_TOKEN BACKEND_INTERNAL_URL HOT_THEMES_REDIS_URL
          extra_env: migrate.env=/finngraph/prod/etl-migrate
          service: airflow-apiserver airflow-scheduler airflow-dag-processor
          pre_deploy_service: migrate neo4j-init airflow-init
          image_env_var: AIRFLOW_IMAGE
          image_name: ${{ env.AIRFLOW_REPOSITORY }}
          image_digest: ${{ steps.airflow.outputs.image_digest }}
          extra_images: MIGRATIONS_IMAGE=${{ env.MIGRATIONS_REPOSITORY }}@${{ steps.migrations.outputs.image_digest }}
          health_url: http://127.0.0.1:8080/api/v2/monitor/health
          command_timeout_seconds: "900"

name: CD

# CI 가 통과한 develop 커밋만 이미지로 만들어 ECR 에 올리고 서버를 교체한다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: "빌드할 커밋 SHA (비우면 develop 최신)"
        required: false

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

# 계정 ID·인스턴스 ID 는 저장소 변수에 둔다(Settings → Variables).
env:
  AWS_REGION: ap-northeast-2
  DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: finngraph/etl-airflow

jobs:
  build-push:
    name: Build and push to ECR
    # workflow_run 은 CI 실패에도 발화한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # dev 서버가 t4g(Graviton) 이다. x86 러너 + QEMU 는 pip 설치가 훨씬 느리다.
    runs-on: ubuntu-24.04-arm

    # OIDC 토큰 발급 권한을 이 job 으로 한정한다.
    permissions:
      id-token: write
      contents: read

    steps:
      # workflow_run 컨텍스트에서 checkout 의 기본 ref 는 기본 브랜치의 머리다.
      # CI 를 통과시킨 그 커밋을 명시하지 않으면 다른 코드를 빌드하게 된다.
      # 변수가 비면 ARN 이 깨진 채 인증 단계까지 가서 원인을 찾기 어렵다.
      - name: 저장소 변수 확인
        run: |
          : "${AWS_ACCOUNT_ID:?저장소 변수 AWS_ACCOUNT_ID 가 없습니다}"
          : "${DEPLOY_INSTANCE_ID:?저장소 변수 DEPLOY_INSTANCE_ID 가 없습니다}"
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}

      - name: 빌드 대상 확인
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "빌드 커밋: $SHA"
          git log --oneline -1

      - name: AWS 자격증명 (OIDC — 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/finngraph-github-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 빌드 · push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow/Dockerfile
          platforms: linux/arm64
          push: true
          # SHA 가 배포 단위다. develop 은 편의용 포인터.
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버 코드를 이미지와 같은 커밋으로 맞춘 뒤 교체한다.
      # 실행 중인 태스크는 죽는다(LocalExecutor). EKS 전환 시 해소된다.
      - name: 서버 배포 (SSM)
        run: |
          SHA='${{ steps.meta.outputs.sha }}'
          REMOTE=$(cat <<EOS
          set -euo pipefail
          cd /opt/finngraph-etl
          git -c safe.directory=/opt/finngraph-etl fetch origin develop --quiet
          git -c safe.directory=/opt/finngraph-etl reset --hard "$SHA" --quiet
          chown -R ec2-user:ec2-user /opt/finngraph-etl
          scripts/dev-env.sh .env.dev
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG="$SHA" docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --remove-orphans
          docker compose --env-file .env.dev -f docker-compose.dev.yml ps
          EOS
          )
          B64=$(printf '%s' "$REMOTE" | base64 -w0)

          CMD=$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD deploy $SHA" --timeout-seconds 900 \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 90); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                   --instance-id "$DEPLOY_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|TimedOut|Cancelled) break ;; *) sleep 10 ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$ST" = "Success" ] || exit 1

      - name: 요약
        run: |
          {
            echo "### ECR push 완료"
            echo '```'
            echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}"
            echo '```'
            echo "### 배포 완료"
            echo "서버가 이 이미지로 교체되었다."
          } >> "$GITHUB_STEP_SUMMARY"

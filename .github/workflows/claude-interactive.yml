# PR/이슈 코멘트에서 `@claude ...`로 멘션하면 Claude가 해당 스레드 맥락으로 응답한다.
# 봇의 리뷰 코멘트에 답글로 되물을 때도 `@claude`를 포함해야 다시 호출된다.
# 인증: Claude Max 구독 OAuth 토큰 (CLAUDE_CODE_OAUTH_TOKEN)
name: Claude Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 이슈 관리는 Jira로 하므로 issues 권한은 부여하지 않는다.
# (issue_comment 이벤트는 이름과 달리 PR 대화 탭 코멘트에도 발생하므로 유지해야 한다.)
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # prompt를 생략하면 인터랙티브(멘션 응답) 모드로 동작한다.
          trigger_phrase: "@claude"
          track_progress: "true"
          claude_args: |
            --max-turns 10
            --allowedTools Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment

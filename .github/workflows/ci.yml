name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치/PR에 새 커밋이 푸시되면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install deps (dev 그룹 포함)
        # dev dependency-group은 uv sync가 기본 포함한다(extra와 달리 옵션 불필요).
        run: uv sync --python ${{ env.PYTHON_VERSION }}
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install deps (dev 그룹 포함)
        run: uv sync --python ${{ env.PYTHON_VERSION }}
      - name: compileall
        run: uv run python -m compileall pipelines dags scripts tests
      - name: pytest (integration 제외)
        # 아직 유닛 테스트가 0개일 수 있다. pytest는 수집된 테스트가 없으면 exit 5를 반환하는데,
        # 이는 실패가 아니라 "테스트 없음"이므로 초록으로 처리한다. 테스트가 추가되면 자동 실행된다.
        run: |
          set +e
          uv run pytest -m "not integration"
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "수집된 유닛 테스트가 없습니다(exit 5) — 통과로 처리."
            exit 0
          fi
          exit $code

  dag-validation:
    name: DAG validation (airflow)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install apache-airflow (constraints 고정)
        # 무거운 import(extractor, DB 클라이언트)는 task 함수 안에서 하므로 파싱에 프로젝트
        # 런타임 의존성은 필요 없다. 다만 DAG가 fan-out 개수를 정하려면 파싱 시점에
        # pipelines.themes.sources 같은 의존성 없는 상수 모듈은 읽어야 하므로,
        # 프로젝트를 --no-deps로 얹어 경로만 잡아준다.
        # airflow는 의존성이 많아 공식 constraints 파일로 버전을 고정해 재현성을 확보한다.
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINTS}"
          python -m pip install -e . --no-deps
      - name: Validate DAGs
        run: python scripts/validate_dags.py

  db-integration:
    name: DB integration
    runs-on: ubuntu-latest
    # 실제 Postgres에 붙어 loader/DDL을 검증한다. news 로더는 psycopg2, 기존
    # test_db_extensions는 common(psycopg v3/SQLAlchemy) 경로를 스모크한다.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d etl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # news 로더(psycopg2 직접 연결)용. conftest 기본값(15432)을 서비스 포트로 덮어씀.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: etl
      DB_USER: etl
      DB_PASSWORD: etl
      # common.clients.postgres(psycopg v3 + SQLAlchemy)용.
      DATABASE_URL: postgresql+psycopg://etl:etl@localhost:5432/etl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install deps (dev 그룹 + news extra)
        # news extra로 psycopg2-binary/beautifulsoup4까지 설치해야 로더 import가 된다.
        # dev dependency-group은 uv sync가 기본 포함하므로 --extra news만 추가한다.
        run: uv sync --extra news --python ${{ env.PYTHON_VERSION }}
      - name: Prepare DB (timescaledb 확장 보장)
        # test_db_extensions가 요구하는 확장을 idempotent하게 보장한다. news 테이블은
        # 통합 테스트 픽스처가 최소 스키마를 직접 생성하므로 여기서 만들지 않는다.
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://etl:etl@localhost:5432/etl", autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS timescaledb")
          PY
      - name: pytest (integration만)
        run: uv run pytest -m integration

  # 브랜치 보호 규칙에서 이 하나만 required check로 걸면 위 job 결과가 모두 반영된다.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, unit-test, dag-validation, db-integration]
    if: always()
    steps:
      - name: 결과 집계
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "unit-test=${{ needs.unit-test.result }}"
          echo "dag-validation=${{ needs.dag-validation.result }}"
          echo "db-integration=${{ needs.db-integration.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.unit-test.result }}" != "success" ] \
          || [ "${{ needs.dag-validation.result }}" != "success" ] \
          || [ "${{ needs.db-integration.result }}" != "success" ]; then
            echo "하나 이상의 필수 job이 실패했습니다."
            exit 1
          fi
          echo "모든 필수 job 통과."

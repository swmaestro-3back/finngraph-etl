name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치/PR에 새 커밋이 푸시되면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: compileall
        run: python -m compileall pipelines dags scripts tests
      - name: pytest (integration 제외)
        # 아직 유닛 테스트가 0개일 수 있다. pytest는 수집된 테스트가 없으면 exit 5를 반환하는데,
        # 이는 실패가 아니라 "테스트 없음"이므로 초록으로 처리한다. 테스트가 추가되면 자동 실행된다.
        run: |
          set +e
          pytest -m "not integration"
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "수집된 유닛 테스트가 없습니다(exit 5) — 통과로 처리."
            exit 0
          fi
          exit $code

  dag-validation:
    name: DAG validation (airflow)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "2.9.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install apache-airflow (constraints 고정)
        # DAG 파일은 pipelines를 task 함수 안에서 import하므로 파싱에는 airflow만 있으면 된다.
        # airflow는 의존성이 많아 공식 constraints 파일로 버전을 고정해 재현성을 확보한다.
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINTS}"
      - name: Validate DAGs
        run: python scripts/validate_dags.py

  # NOTE: DB 통합 job은 의도적으로 아직 넣지 않았다. 현재 DB는 공식 timescaledb 이미지라
  # 확장 존재 확인은 남의 이미지를 테스트하는 셈이고, migration/loader 등 DB에 의존하는
  # 우리 코드가 아직 없다. migration과 loader 테스트가 생기면 그때 db-integration을 추가한다.
  # 통합 테스트 씨앗은 tests/integration/ 에 있으며 로컬에서 `pytest -m integration`으로 실행 가능.

  # 브랜치 보호 규칙에서 이 하나만 required check로 걸면 위 job 결과가 모두 반영된다.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, unit-test, dag-validation]
    if: always()
    steps:
      - name: 결과 집계
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "unit-test=${{ needs.unit-test.result }}"
          echo "dag-validation=${{ needs.dag-validation.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.unit-test.result }}" != "success" ] \
          || [ "${{ needs.dag-validation.result }}" != "success" ]; then
            echo "하나 이상의 필수 job이 실패했습니다."
            exit 1
          fi
          echo "모든 필수 job 통과."
